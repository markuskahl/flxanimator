<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlxAnimator</title>
    <style>
        body {
            background-color: #0f1115;
            color: #e2e8f0;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="app-header" class="app-header glass" style="display: none;">
        <div class="logo">FlxAnimator</div>
        <div class="header-actions">
            <button id="btn-new-project">New</button>
            <button id="btn-open-project">Open</button>
            <button id="btn-save-project" class="primary">Save</button>
            <button id="btn-save-as-project">Save As</button>
            <button id="btn-close-app" class="btn-icon" title="Close App">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <aside id="sidebar" class="sidebar glass-panel" style="display: none;">
            <section class="panel">
                <button id="btn-add-anim" class="secondary" style="width: 100%; margin-bottom: 10px;">Add
                    Animation</button>
                <div id="edit-anim-controls" class="animation-controls" style="display: none; margin-bottom: 10px;">
                    <h3>Edit selected animation</h3>
                    <input type="text" id="anim-name" placeholder="Name (e.g. idle)">
                    <div class="form-row">
                        <input type="number" id="anim-fps" placeholder="FPS" value="15" min="1">
                        <label class="checkbox-label">
                            <input type="checkbox" id="anim-loop" checked> Loop
                        </label>
                        <label class="checkbox-label" style="margin-left: 10px;">
                            <input type="checkbox" id="anim-flip-x"> FlipX
                        </label>
                        <label class="checkbox-label" style="margin-left: 10px;">
                            <input type="checkbox" id="anim-flip-y"> FlipY
                        </label>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 5px; margin-bottom: 10px;">
                    <label for="default-anim-select" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Default Animation</label>
                    <select id="default-anim-select">
                        <option value="">-- None --</option>
                    </select>
                </div>
                <ul id="animation-list" class="scrollable"></ul>
            </section>

        </aside>

        <section class="workspace" style="flex-direction: column;">
            <div id="start-screen" class="start-screen glass-panel">
                <div class="start-content">
                    <h1>FlxAnimator</h1>
                    <p>Create a new project or open an existing one.</p>
                    <div class="start-actions">
                        <button id="btn-start-new-project" class="primary pulse">New</button>
                        <button id="btn-start-open-project">Open</button>
                    </div>
                    <div class="recent-projects-container">
                        <h3>Recent Projects</h3>
                        <ul id="recent-projects-list" class="recent-list scrollable">
                            <!-- Filled by JS -->
                        </ul>
                    </div>
                </div>
            </div>

            <div id="workspace-top" style="display: none; flex: 1; min-height: 0; position: relative;">
                <div id="workspace-left" class="workspace-pane">
                    <div class="workspace-scroll" id="workspace-scroll">
                        <div class="grid-container glass-panel" id="grid-container">
                            <img id="spritesheet-img" style="display:none;" alt="Spritesheet" />
                            <canvas id="grid-canvas"></canvas>
                        </div>
                    </div>
                </div>

                <div id="workspace-resizer" class="resizer"></div>

                <div id="workspace-right" class="workspace-pane">
                    <div class="workspace-scroll" id="preview-scroll">
                        <div class="preview-transform-container" id="preview-transform-container">
                            <canvas id="preview-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div id="workspace-timeline" class="glass-panel" style="display: none; height: 270px; flex-shrink: 0; flex-direction: column; border-top: 1px solid var(--border-color); border-left: none; border-right: none; border-bottom: none; background: rgba(15, 17, 21, 0.95);">
                <div class="timeline-header" style="padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-color);">
                    <div style="font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Timeline</div>
                    <div class="timeline-actions" style="display: flex; gap: 0.5rem;">
                        <button id="btn-timeline-add" class="secondary" style="padding: 0.3rem 0.8rem; font-size: 0.8rem; width: auto;">Add Frame</button>
                    </div>
                </div>
                <div id="timeline-frames" class="scrollable" style="display: flex; flex-direction: row; flex: 1; padding: 1rem; gap: 1rem; align-items: center; overflow-y: hidden; overflow-x: auto; margin-top: 0;">
                    <!-- Timeline items -->
                </div>
            </div>
        </section>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar" id="status-bar">
        Ready
    </footer>

    <!-- Modal: Neues Projekt -->
    <div id="modal-new-project" class="modal">
        <div class="modal-content glass-modal">
            <h2>Configure New Project</h2>
            <div class="form-group">
                <label>Select Spritesheet:</label>
                <div class="file-input-group">
                    <input type="text" id="proj-img-path" readonly placeholder="Click to browse...">
                    <button id="btn-browse-img">Browse</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Frame Width (px):</label>
                    <input type="number" id="proj-width" value="16" min="1">
                </div>
                <div class="form-group">
                    <label>Frame Height (px):</label>
                    <input type="number" id="proj-height" value="16" min="1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Spacing:</label>
                    <input type="number" id="proj-spacing" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Margin:</label>
                    <input type="number" id="proj-margin" value="0" min="0">
                </div>
            </div>
            <div id="new-project-warning" class="form-warning"></div>
            <div class="modal-actions">
                <button id="btn-cancel-new">Cancel</button>
                <button id="btn-create-new" class="primary">Start Project</button>
            </div>
        </div>
    </div>



    <!-- Modal: Neue Animation -->
    <div id="modal-new-anim" class="modal">
        <div class="modal-content glass-modal">
            <h2>New Animation</h2>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="new-anim-name" placeholder="e.g. idle">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>FPS:</label>
                    <input type="number" id="new-anim-fps" value="15" min="1">
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <div style="display: flex; gap: 10px; margin-bottom: 0.8rem;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="new-anim-loop" checked> Loop
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="new-anim-flip-x"> FlipX
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="new-anim-flip-y"> FlipY
                        </label>
                    </div>
                </div>
            </div>
            <div id="new-anim-warning" class="form-warning"></div>
            <div class="modal-actions">
                <button id="btn-cancel-new-anim">Cancel</button>
                <button id="btn-confirm-new-anim" class="primary">Add</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
